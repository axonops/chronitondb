name: Ant Check

on:
    push:
        branches:
            - '**'

jobs:
    ant-check-jdk11:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
          - name: JDK 11
            uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
            with:
              java-version: '11'
              distribution: 'temurin'
          - name: Run Code Checks
            run: .build/docker/check-code.sh 11

    ant-check-jdk17:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
          - name: JDK 17
            uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Run Code Checks
            # --summary exercises run_ant's summary path against real ant output
            run: .build/docker/check-code.sh 17 --summary