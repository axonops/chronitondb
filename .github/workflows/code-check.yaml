name: Ant Check

# ChronitonDB (AC1): runs on every pull request so it can be a required check, also
# for pull requests from forks, and on pushes to the lines only, not on branches
# still being worked on.
on:
    pull_request:
        branches:
            - 'chronitondb-*'
    push:
        branches:
            - 'chronitondb-*'

jobs:
    ant-check-jdk17:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
          - name: JDK 17
            uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Run Code Checks
            # --summary exercises run_ant's summary path against real ant output
            run: .build/docker/check-code.sh 17 --summary