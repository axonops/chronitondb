# Semgrep CE with the house rules in tools/chronitondb/semgrep on the files a
# pull request changes, without the findings already on the merge base
# (decision E13, build plan step 1.4). Semgrep runs from its container image
# pinned by digest in tools/chronitondb/semgrep-check.sh, without network.
# Advisory: a finding fails this check, which blocks nothing until the owner
# makes it required. Every action is pinned to a commit.
name: ChronitonDB Semgrep

on:
  pull_request:
    branches:
      - 'chronitondb-*'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the rules
        run: tools/chronitondb/semgrep-check.sh --self-test

      - name: Semgrep on the changed files
        env:
          BASE: ${{ github.base_ref }}
        run: tools/chronitondb/semgrep-check.sh --base "origin/$BASE"
