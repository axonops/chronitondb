# A character outside ASCII in Java code under org/chronitondb, outside a
# string, text block, character literal or comment. Outside those, Java only
# allows such a character in an identifier, where a Cyrillic "a" looks like a
# Latin one and two names that read the same can be different (homoglyphs).
# Strings and comments may carry any text, test data in other scripts is
# normal for a search engine.
rules:
  - id: chronitondb-non-ascii-identifier
    languages: [java]
    severity: ERROR
    paths:
      include:
        - "**/org/chronitondb/**"
    message: >-
      Non-ASCII character in code, outside a string or a comment. Identifiers
      in ChronitonDB code are ASCII only, so that names that look alike are
      alike. Use an ASCII name, or a string with a \u escape for data.
    patterns:
      - pattern-regex: '[^\x00-\x7F]+'
      - pattern-not-inside: '"..."'
      - pattern-not-regex: '//[^\n]*'
      - pattern-not-regex: '/\*(?s:.)*?\*/'
      - pattern-not-regex: '"""(?s:.)*?"""'
      - pattern-not-regex: '''(?:[^''\\\n]|\\.)+'''
