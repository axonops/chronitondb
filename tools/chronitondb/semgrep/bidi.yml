# Unicode bidirectional control characters, in any file a pull request
# changes. They reorder how text is displayed without changing what a
# compiler or a shell reads, so a reviewer sees different code from the code
# that runs (Trojan Source, CVE-2021-42574). The characters are written as
# escapes, this file carries none of them.
rules:
  - id: chronitondb-bidi-control-character
    languages: [regex]
    severity: ERROR
    message: >-
      Unicode bidirectional control character (U+061C, U+200E, U+200F,
      U+202A to U+202E or U+2066 to U+2069). It changes how the text is shown
      without changing what runs. Remove it, or write it as an escape.
    pattern-regex: '[\x{061C}\x{200E}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]'
