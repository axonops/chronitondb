# Java serialization. ObjectInputStream builds any serializable class named in
# its input, which turns a crafted byte stream into code execution through a
# gadget chain on the classpath. Applies to every Java file a pull request
# changes, stock or not.
rules:
  - id: chronitondb-object-input-stream
    languages: [java]
    severity: ERROR
    message: >-
      ObjectInputStream deserializes whatever class its input names. Use the
      in tree serializers (IVersionedSerializer, TypeSizes, DataInputPlus) or
      a format with a fixed schema instead.
    pattern-either:
      - pattern: new ObjectInputStream(...)
      - pattern: new java.io.ObjectInputStream(...)
      - pattern: |
          class $C extends ObjectInputStream { ... }
      - pattern: |
          class $C extends java.io.ObjectInputStream { ... }
      - pattern: new ObjectInputStream(...) { ... }
